<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Urban Radar - Food Truck Menu</title>
    <meta name="description" content="Mobile Food Truck POS & Merchant Operations System featuring yakitori & baked gratin menu channels, multi-tier tag filtering, cloud database synchronization, Bluetooth & hardware split printing, real-human style voice broadcast for queue/orders/riders, and loss & stocktake accounting." />
    <meta property="og:title" content="Urban Radar - Food Truck Menu" />
    <meta property="og:description" content="Mobile Food Truck POS & Merchant Operations System featuring yakitori & baked gratin menu channels, multi-tier tag filtering, cloud database synchronization, Bluetooth & hardware split printing, real-human style voice broadcast for queue/orders/riders, and loss & stocktake accounting." />
    <script>
      // Global uncaught error guard for iframe preview stability
      window.addEventListener('error', function(event) {
        if (!event.message || event.message === 'Script error.' || event.message.indexOf('Script error') !== -1) {
          if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
          if (typeof event.preventDefault === 'function') event.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (!event.reason || event.reason === 'Script error.' || (event.reason && event.reason.message === 'Script error.')) {
          if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
          if (typeof event.preventDefault === 'function') event.preventDefault();
        }
      }, true);
    </script>

    <!-- Leaflet 真实地图 (中国可达 CDN + 真实瓦片, 取代硬编码上海 SVG) -->
    <link
      rel="stylesheet"
      href="https://cdn.bootcdn.net/ajax/libs/leaflet/1.9.4/leaflet.min.css"
      crossorigin=""
    />
    <script
      src="https://cdn.bootcdn.net/ajax/libs/leaflet/1.9.4/leaflet.min.js"
      crossorigin=""
    ></script>
    <style>
      /* 避免 Leaflet 图片被 Tailwind 的 img{max-width:100%} 压缩变形 */
      .leaflet-container img { max-width: none !important; }
      .leaflet-container { background: #eef0f2; font-family: inherit; }
      .truck-pin { filter: drop-shadow(0 2px 3px rgba(0,0,0,0.35)); }
    </style>
  </head>
  <body class="bg-[#f9f9f7] text-[#1a1c1b] antialiased selection:bg-neutral-900 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
